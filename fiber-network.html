<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus — Fiber Network</title>
<style>
  html,body{
    margin:0;
    height:100%;
    background:#04060c;
    overflow:hidden;
  }
  canvas{
    position:fixed;
    inset:0;
    display:block;
    width:100vw;
    height:100vh;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
  "use strict";

  var canvas = document.getElementById('c');
  var vctx = canvas.getContext('2d');

  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  var W = 0, H = 0;
  var buffer = document.createElement('canvas');
  var bctx = buffer.getContext('2d');
  var bloom = document.createElement('canvas');
  var blctx = bloom.getContext('2d');
  var bgLayer = document.createElement('canvas');
  var bgCtx = bgLayer.getContext('2d');
  var burstSprite = document.createElement('canvas');
  var BLOOM_SCALE = 0.5;

  function resize(){
    W = Math.floor(window.innerWidth * DPR);
    H = Math.floor(window.innerHeight * DPR);
    canvas.width = W; canvas.height = H;
    buffer.width = W; buffer.height = H;
    bloom.width = Math.max(1, Math.floor(W * BLOOM_SCALE));
    bloom.height = Math.max(1, Math.floor(H * BLOOM_SCALE));
    bgLayer.width = W; bgLayer.height = H;
    bctx.clearRect(0,0,W,H);
    buildScene();
    paintBackground();
    paintBurstSprite();
  }

  function paintBackground(){
    bgCtx.fillStyle = '#04060c';
    bgCtx.fillRect(0,0,W,H);
    var g = bgCtx.createRadialGradient(focal.x, focal.y, 0, focal.x, focal.y, Math.max(W,H)*0.75);
    g.addColorStop(0, 'rgba(28,58,96,0.35)');
    g.addColorStop(0.5, 'rgba(14,22,46,0.12)');
    g.addColorStop(1, 'rgba(4,6,12,0)');
    bgCtx.fillStyle = g;
    bgCtx.fillRect(0,0,W,H);
  }

  function paintBurstSprite(){
    var rad = W*0.16;
    var s = rad*2;
    burstSprite.width = s; burstSprite.height = s;
    var x = burstSprite.getContext('2d');
    var g = x.createRadialGradient(rad,rad,0, rad,rad,rad);
    g.addColorStop(0, 'rgba(235,248,255,0.4)');
    g.addColorStop(0.3, 'rgba(120,210,255,0.16)');
    g.addColorStop(1, 'rgba(80,90,200,0)');
    x.fillStyle = g;
    x.fillRect(0,0,s,s);
  }

  /* ---------------------------------------------------------------- */
  /* colour sprites: pre-rendered radial glows, reused via drawImage   */
  /* ---------------------------------------------------------------- */
  var HUES = [
    { core:'rgba(230,250,255,0.95)', mid:'rgba(94,205,255,0.55)', edge:'rgba(50,140,200,0)' },  // bright cyan
    { core:'rgba(216,249,255,0.92)', mid:'rgba(64,196,255,0.5)',  edge:'rgba(35,120,180,0)' },  // cyan
    { core:'rgba(232,224,255,0.92)', mid:'rgba(150,120,255,0.5)', edge:'rgba(85,65,170,0)' },   // violet
    { core:'rgba(241,233,255,0.9)',  mid:'rgba(180,145,255,0.45)','edge':'rgba(105,80,185,0)' },// light violet
    { core:'rgba(223,245,255,0.9)',  mid:'rgba(90,180,225,0.45)', edge:'rgba(45,105,150,0)' }   // teal-cyan
  ];
  var sprites = HUES.map(makeSprite);

  var grainPattern = (function(){
    var s = 96;
    var c = document.createElement('canvas');
    c.width = s; c.height = s;
    var x = c.getContext('2d');
    var id = x.createImageData(s,s);
    for (var i=0;i<id.data.length;i+=4){
      var v = Math.random()*255;
      id.data[i] = v; id.data[i+1] = v; id.data[i+2] = v;
      id.data[i+3] = Math.random()*46;
    }
    x.putImageData(id,0,0);
    return vctx.createPattern(c, 'repeat');
  })();

  function makeSprite(h){
    var s = 256;
    var c = document.createElement('canvas');
    c.width = s; c.height = s;
    var x = c.getContext('2d');
    var g = x.createRadialGradient(s/2,s/2,0, s/2,s/2,s/2);
    g.addColorStop(0, h.core);
    g.addColorStop(0.09, h.mid);
    g.addColorStop(0.5, h.mid.replace(/[\d.]+\)$/, '0.06)'));
    g.addColorStop(1, h.edge);
    x.fillStyle = g;
    x.fillRect(0,0,s,s);
    return c;
  }

  /* ---------------------------------------------------------------- */
  /* scene: hemispherical cluster converging toward an off-screen      */
  /* focal point beyond the right edge                                 */
  /* ---------------------------------------------------------------- */
  var focal = {x:0, y:0};
  var nodes = [];
  var majors = [];

  function rand(a,b){ return a + Math.random()*(b-a); }

  function buildScene(){
    nodes = [];
    majors = [];
    focal.x = W + W*0.05;
    focal.y = H*0.52;

    var Rmax = Math.max(W,H) * 1.0;
    var area = (W*H) / (DPR*DPR);
    var density = Math.min(1.35, Math.max(0.55, area / (1440*900)));

    var majorCount  = Math.round(240 * density);
    var minorCount  = Math.round(420 * density);
    var dustCount   = Math.round(560 * density);

    function place(tier, count){
      for (var i=0;i<count;i++){
        var theta = rand(-100,100) * Math.PI/180;
        var rr = Rmax * (0.12 + 0.88*Math.pow(Math.random(), 0.58));
        var depth = Math.random();
        var xScale = 0.60;

        var n = {
          theta: theta,
          r: rr,
          depth: depth,
          tier: tier,
          x:0, y:0,
          hue: Math.random() < 0.68 ? (Math.random()<0.5?0:1) : (Math.random()<0.6?2:3),
          phase: rand(0, Math.PI*2),
          breatheSpeed: rand(0.10, 0.30),
          driftAmp: rand(1.5, 6) * (0.4 + depth*0.9),
          driftFx: rand(0.05, 0.14),
          driftFy: rand(0.04, 0.12),
          driftSx: rand(0, 100),
          driftSy: rand(0, 100),
          hasStrand: false,
          parent: null
        };

        var sizeBase;
        if (tier === 'major'){
          sizeBase = rand(3.4, 7.5) * (0.55 + depth*0.9);
          if (Math.random() < 0.06) sizeBase *= rand(1.3, 1.6); // occasional hero node
          n.hasStrand = Math.random() < 0.72;
        } else if (tier === 'minor'){
          sizeBase = rand(1.6, 3.6) * (0.5 + depth*0.8);
          n.hasStrand = Math.random() < 0.30;
        } else {
          sizeBase = rand(0.5, 1.3) * (0.4 + depth*0.7);
          n.hasStrand = false;
          n.stem = Math.random() < 0.38;
        }
        n.size = sizeBase * DPR;
        n.alpha = (tier === 'dust' ? rand(0.2,0.5) : rand(0.45,0.85)) * (0.45 + depth*0.65);

        n.baseX = focal.x - Math.cos(theta) * rr * xScale;
        n.baseY = focal.y + Math.sin(theta) * rr;
        n.curve = rand(-1,1) * rand(20,70) * DPR;

        nodes.push(n);
        if (tier === 'major') majors.push(n);
      }
    }

    place('major', majorCount);
    place('minor', minorCount);
    place('dust', dustCount);

    majors.sort(function(a,b){ return a.theta - b.theta; });
    for (var i=0;i<nodes.length;i++){
      var n = nodes[i];
      if ((n.tier === 'minor' && !n.hasStrand) || (n.tier === 'dust' && n.stem)){
        n.parent = nearestMajor(n.theta);
      }
    }
  }

  function nearestMajor(theta){
    if (!majors.length) return null;
    var lo=0, hi=majors.length-1;
    while (lo < hi){
      var mid = (lo+hi)>>1;
      if (majors[mid].theta < theta) lo = mid+1; else hi = mid;
    }
    var candidates = [lo-1, lo, lo+1].filter(function(i){ return i>=0 && i<majors.length; });
    var best = null, bestD = Infinity;
    candidates.forEach(function(i){
      var d = Math.abs(majors[i].theta - theta);
      if (d < bestD){ bestD = d; best = majors[i]; }
    });
    return best;
  }

  /* ---------------------------------------------------------------- */
  /* per-frame update + draw                                           */
  /* ---------------------------------------------------------------- */
  var t0 = performance.now();

  function updatePos(n, t){
    n.x = n.baseX + Math.sin(t*n.driftFx + n.driftSx) * n.driftAmp;
    n.y = n.baseY + Math.cos(t*n.driftFy + n.driftSy) * n.driftAmp;
    var breathe = 1 + 0.16 * Math.sin(t*n.breatheSpeed*Math.PI*2 + n.phase);
    n.curSize = n.size * breathe;
    n.curAlpha = n.alpha * (0.78 + 0.22*breathe);
  }

  var STRAND_COLOR = HUES.map(function(h){
    return h.mid.replace(/[\d.]+\)$/, '1)');
  });

  function strokeStrand(x1,y1,x2,y2,curve,alpha,hueIdx,widthPx){
    var mx = (x1+x2)/2 + curve, my = (y1+y2)/2;
    bctx.strokeStyle = STRAND_COLOR[hueIdx];
    bctx.globalAlpha = alpha;
    bctx.lineWidth = widthPx;
    bctx.beginPath();
    bctx.moveTo(x1,y1);
    bctx.quadraticCurveTo(mx,my,x2,y2);
    bctx.stroke();
  }

  function drawNode(n){
    var sprite = sprites[n.hue];
    var s = n.curSize * 3.4;
    bctx.globalAlpha = Math.max(0, Math.min(1, n.curAlpha));
    bctx.drawImage(sprite, n.x - s/2, n.y - s/2, s, s);
  }

  var settleFrames = 0;

  function frame(now){
    var t = reduced ? 0.6 : (now - t0) / 1000;

    /* fade the previous frame's additive content toward transparent (trail / motion blur) */
    bctx.globalCompositeOperation = 'destination-out';
    bctx.globalAlpha = 0.22;
    bctx.fillStyle = '#000';
    bctx.fillRect(0,0,W,H);
    bctx.globalAlpha = 1;

    for (var i=0;i<nodes.length;i++) updatePos(nodes[i], t);

    bctx.globalCompositeOperation = 'lighter';

    for (i=0;i<nodes.length;i++){
      var n = nodes[i];
      if (n.hasStrand){
        strokeStrand(n.x, n.y, focal.x, focal.y, n.curve, n.curAlpha*0.5, n.hue, Math.max(0.6, n.size*0.09));
      } else if (n.parent){
        var p = n.parent;
        strokeStrand(n.x, n.y, p.x !== undefined ? p.x : p.baseX, p.y !== undefined ? p.y : p.baseY, n.curve*0.4, n.curAlpha*0.35, n.hue, Math.max(0.5, n.size*0.12));
      }
    }

    for (i=0;i<nodes.length;i++) drawNode(nodes[i]);

    var burstPulse = 0.75 + 0.25*Math.sin(t*0.18);
    bctx.globalAlpha = burstPulse;
    bctx.drawImage(burstSprite, focal.x - burstSprite.width/2, focal.y - burstSprite.height/2);
    bctx.globalAlpha = 1;

    bctx.globalCompositeOperation = 'source-over';

    /* compose: static background + sharp nodes + soft bloom pulled from a down-sampled, pre-blurred pass */
    blctx.clearRect(0,0,bloom.width,bloom.height);
    blctx.filter = 'blur(3px)';
    blctx.drawImage(buffer, 0,0, bloom.width, bloom.height);
    blctx.filter = 'none';

    vctx.clearRect(0,0,W,H);
    vctx.drawImage(bgLayer, 0,0);
    vctx.globalCompositeOperation = 'lighter';
    vctx.drawImage(buffer, 0,0);
    vctx.globalAlpha = 0.55;
    vctx.drawImage(bloom, 0,0, W,H);
    vctx.globalAlpha = 1;
    vctx.globalCompositeOperation = 'source-over';

    vctx.globalAlpha = 0.06;
    vctx.fillStyle = grainPattern;
    vctx.fillRect(0,0,W,H);
    vctx.globalAlpha = 1;

    settleFrames++;
    if (!reduced || settleFrames < 30) requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
